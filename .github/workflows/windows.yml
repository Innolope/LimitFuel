name: Windows checks
on:
  pull_request:
    paths: ['linux/**', 'app/Diagnostics.plist', '.github/workflows/windows.yml']
  push:
    branches: [main]
    paths: ['linux/**', 'app/Diagnostics.plist', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.93.0
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component clippy
          rustup default 1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux
      - name: Core tests
        run: cargo test -p limitfuel-core --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Bundle NSIS installer
        working-directory: linux/app
        run: npx --yes @tauri-apps/cli@2.12.3 build --bundles nsis
      - name: Smoke test
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$(./target/release/limitfuel.exe --version)" = "LimitFuel $version"
          installer=$(ls target/release/bundle/nsis/*-setup.exe)
          # A per-user install needs no elevation and lands in %LOCALAPPDATA%.
          "$installer" //S
          installed="$LOCALAPPDATA/LimitFuel/limitfuel.exe"
          test -f "$installed"
          test "$("$installed" --version)" = "LimitFuel $version"
          running() { tasklist //FI "IMAGENAME eq limitfuel.exe" //NH | grep -ci 'limitfuel.exe' || true; }
          # The tray app must start, create its icon and keep running.
          "$installed" &
          sleep 20
          test "$(running)" = 1
          # A second launch hands over to the first one and exits.
          "$installed" &
          sleep 10
          test "$(running)" = 1
          taskkill //F //IM limitfuel.exe
          # Uninstalling removes open at login. The uninstaller re-runs itself from a
          # temporary copy, so wait for the value to go.
          run_key='HKCU\Software\Microsoft\Windows\CurrentVersion\Run'
          reg add "$run_key" //v LimitFuel //t REG_SZ //d "\"$(cygpath -w "$installed")\"" //f
          "$LOCALAPPDATA/LimitFuel/uninstall.exe" //S
          for _ in $(seq 1 60); do reg query "$run_key" //v LimitFuel >/dev/null 2>&1 || break; sleep 1; done
          if reg query "$run_key" //v LimitFuel >/dev/null 2>&1; then echo "Run value left behind"; exit 1; fi
          test ! -e "$installed"
      - uses: actions/upload-artifact@v4
        with:
          name: limitfuel-windows
          path: linux/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
