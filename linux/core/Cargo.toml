[package]
name = "limitfuel-core"
description = "Claude and Codex usage logic shared by LimitFuel for Linux and Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aes = "0.9.3"
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
libc = "0.2.190"
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.154"
sha1 = "0.10.7"
sha2 = "0.11.1"
ureq = "3.4.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    # Only the tests use WinSock, to reset a connection the way a dropped network does.
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"
