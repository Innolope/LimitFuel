[package]
name = "limitfuel"
description = "Claude and Codex usage in the Linux tray"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
dirs = "7.0.0"
libc = "0.2.190"
limitfuel-core = { path = "../core" }
sentry = { version = "0.49.3", default-features = false, features = ["backtrace", "contexts", "panic", "ureq", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.7.0"
tauri-plugin-single-instance = "2.5.4"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.2.0", features = ["rt-tokio-crypto-rust"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio", "blocking-api"] }
